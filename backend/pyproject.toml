[project]
name = "cascadia-backend"
version = "0.0.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = [
  "E", "W",  # pycodestyle
  "F",       # pyflakes
  "I",       # isort
  "B",       # bugbear
  "UP",      # pyupgrade
  "DJ",      # django
  "S",       # bandit
  "DTZ",     # naive datetimes
  "ANN",     # type hints
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN"]
"conftest.py" = ["ANN"]
"manage.py" = ["ANN"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
testpaths = ["tests"]
addopts = "--strict-markers"

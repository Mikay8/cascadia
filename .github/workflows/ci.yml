name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cascadia
          POSTGRES_PASSWORD: cascadia
          POSTGRES_DB: cascadia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cascadia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://cascadia:cascadia@localhost:5432/cascadia
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build-storybook

  docker:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: cascadia
          POSTGRES_PASSWORD: cascadia
          POSTGRES_DB: cascadia
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cascadia"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cascadia-backend backend
      - run: docker build -t cascadia-frontend frontend
      - name: Smoke test the back-end image
        run: |
          docker run -d --name api --network host \
            -e DJANGO_SECRET_KEY=ci-only \
            -e DATABASE_URL=postgres://cascadia:cascadia@localhost:5432/cascadia \
            -e DJANGO_ALLOWED_HOSTS=localhost \
            -e PORT=8000 \
            cascadia-backend
          for i in $(seq 1 30); do curl -fsS http://localhost:8000/healthz && break; sleep 2; done
          curl -fsS http://localhost:8000/healthz | grep -q '"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/admin/)" = "301"
      - name: Back-end logs
        if: always()
        run: docker logs api || true
      - name: Smoke test the front-end image
        run: |
          docker run -d --name web -p 8080:8080 cascadia-frontend
          for i in $(seq 1 15); do curl -fsS http://localhost:8080/healthz && break; sleep 1; done
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/some/deep/link | grep -q '<div id="root">'
          curl -sI http://localhost:8080/ | grep -qi 'x-frame-options: deny'
